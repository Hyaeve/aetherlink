# 构建并推送 AetherLink 的 x86_64（linux/amd64）镜像到 GHCR。
name: docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest 只跟 main；打 tag 时额外产出 v1.2.3 / 1.2 / 1 三种标签。
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: 构建并推送 linux/amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试镜像
        env:
          # 直接取 metadata 算好的第一个标签：github.repository 含大写，docker 拒绝这种引用。
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          # 用 root 属主的绑定挂载起容器，复现最常见的部署形态：
          # 入口脚本必须自己把 /config 的属主改对，否则容器会反复重启。
          sudo mkdir -p /tmp/al-config
          sudo chown 0:0 /tmp/al-config
          docker run -d --name aetherlink-smoke -p 5151:5151 -v /tmp/al-config:/config "$IMAGE"

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5151/aetherlink/api/health >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "健康检查超时，容器日志："
            docker logs aetherlink-smoke
            docker rm -f aetherlink-smoke
            exit 1
          fi
          echo "健康检查通过"

          # 配置文件必须真的落在挂载卷里，否则说明写入被静默跳过了。
          if ! sudo test -f /tmp/al-config/config.yaml; then
            echo "错误：/config/config.yaml 未生成，容器日志："
            docker logs aetherlink-smoke
            docker rm -f aetherlink-smoke
            exit 1
          fi
          echo "配置文件已写入挂载卷："
          sudo ls -l /tmp/al-config

          # 确认主进程确实降权了：docker exec 用的是镜像的 USER（root），
          # 所以要看 PID 1 的真实属主，而不是 exec 进去的身份。
          main_uid=$(docker exec aetherlink-smoke stat -c %u /proc/1)
          echo "PID 1 的 uid：$main_uid"
          if [ "$main_uid" = "0" ]; then
            echo "错误：主进程仍以 root 运行"
            docker rm -f aetherlink-smoke
            exit 1
          fi
          docker rm -f aetherlink-smoke
