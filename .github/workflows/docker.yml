# 构建并推送 AetherLink 的 x86_64（linux/amd64）镜像到 GHCR。
name: docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest 只跟 main；打 tag 时额外产出 v1.2.3 / 1.2 / 1 三种标签。
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: 构建并推送 linux/amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试镜像
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(echo "${{ steps.meta.outputs.version }}")"
          docker run -d --name aetherlink-smoke -p 5151:5151 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5151/aetherlink/api/health >/dev/null; then
              echo "健康检查通过"
              docker rm -f aetherlink-smoke
              exit 0
            fi
            sleep 2
          done
          echo "健康检查超时，容器日志："
          docker logs aetherlink-smoke
          docker rm -f aetherlink-smoke
          exit 1
