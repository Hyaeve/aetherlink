services:
  aetherlink:
    image: ghcr.io/hyaeve/aetherlink:latest
    container_name: AetherLink
    network_mode: bridge
    ports:
      - 15151:5151
      # 每加一个反代上游，就在这里补一条它的反代端口（管理页会提示下一个空闲端口）
      - 5152:5152
    volumes:
      - ./config:/config
    environment:
      - TZ=Asia/Shanghai
    restart: always