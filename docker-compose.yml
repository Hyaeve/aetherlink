services:
  aetherlink:
    image: ghcr.io/hyaeve/aetherlink:latest
    container_name: AetherLink
    network_mode: bridge
    ports:
      - 15151:5151
      # 每加一个反代上游，就在这里补一条它的反代端口（管理页会提示下一个空闲端口）
      - 5152:5152
    volumes:
      - ./config:/config
      - ./cache:/cache
    environment:
      - TZ=Asia/Shanghai
      # 容器监听端口，默认 5151；改这里要同时改上面的 ports 映射（右侧那个数），
      # 例如 AETHERLINK_PORT=8080 配 - 15151:8080。
      # - AETHERLINK_PORT=5151
    restart: always
